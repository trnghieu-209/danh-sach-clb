<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điểm thi</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 30px auto;
            text-align: center;
        }

        th, td {
            border: 2px solid blue;
            padding: 8px 12px;
        }

        th {
            font-weight: bold;
        }

        .toan {
            color: red;
        }

        .vat-li {
            color: yellow;
        }

        .hoa-hoc {
            color: blue;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th rowspan="2">Họ và tên</th>
            <th colspan="3">Điểm thi</th>
        </tr>
        <tr>
            <td class="toan">Toán</td>
            <td class="vat-li">Vật lí</td>
            <td class="hoa-hoc">Hóa học</td>
        </tr>
    </table>
</body>
</html>
