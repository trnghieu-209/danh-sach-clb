<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách câu lạc bộ</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
            background-color: #f0f4ff;
            padding: 25px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border: 3px solid #7895cf;
            border-radius: 12px;
        }

        .info {
            color: #333;
            font-weight: bold;
            text-align: center;
            font-size: 17px;
        }

        h2 {
            color: #345b9a;
            text-align: center;
            text-decoration: underline;
        }

        h3 {
            color: #345b9a;
        }

        li {
            margin: 8px 0;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="info">Nguyễn Hoàng Trung Hiếu 01/01/2009 A1K39</p>

        <h2>Danh sách Câu lạc bộ</h2>

        <h3>• THỂ THAO</h3>
        <ol>
            <li>Bóng đá</li>
            <li>Bóng chuyền</li>
            <li>Bóng rổ</li>
            <li>Võ
                <ol type="a">
                    <li>Karatedo</li>
                    <li>Taekwondo</li>
                    <li>Vovinam</li>
                </ol>
            </li>
            <li>Bơi</li>
        </ol>

        <h3>• NGHỆ THUẬT</h3>
        <ol>
            <li>Mĩ thuật</li>
            <li>Nhiếp ảnh</li>
            <li>Âm nhạc
                <ol type="a">
                    <li>Thanh nhạc</li>
                    <li>Piano</li>
                    <li>Violin</li>
                </ol>
            </li>
            <li>Khiêu vũ</li>
        </ol>
    </div>
</body>
</html>
